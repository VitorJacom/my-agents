name: Sync Documentation to GitHub Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

jobs:
  sync-wiki:
    name: Mirror docs/ to GitHub Wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync docs to GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          WIKI_REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git"

          echo "Clonando o repositório da GitHub Wiki..."
          if ! git clone "$WIKI_REPO" wiki-temp; then
            echo "::error::Falha ao clonar o repositório da Wiki (https://github.com/${{ github.repository }}.wiki.git)."
            echo "::error::Certifique-se de que a Wiki está ativada e que a primeira página (Home) foi criada na aba 'Wiki' do GitHub."
            exit 1
          fi

          echo "Espelhando documentação modular de docs/ para a Wiki..."
          rsync -av --delete --exclude='.git' docs/ wiki-temp/

          cd wiki-temp
          git add .
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de documentação detectada na Wiki. Nada a commitar."
          else
            git commit -m "docs(wiki): sync documentation from docs/ [skip ci]"
            if ! git push origin HEAD; then
              echo "::error::Falha ao enviar commits para o repositório da Wiki."
              exit 1
            fi
            echo "Wiki sincronizada com sucesso!"
          fi
